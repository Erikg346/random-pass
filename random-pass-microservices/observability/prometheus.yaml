global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'password-api'
    static_configs:
      - targets: ['password-api:5000']

  - job_name: 'policy-service'
    static_configs:
      - targets: ['policy-service:5000']

  - job_name: 'history-service'
    static_configs:
      - targets: ['history-service:5000']